name: Verify graphic editor
on:
  push:
    branches: [main, design/minhdien-art-motion, feat/studio-production-20261006, feat/image-toolbar-20261006, feat/clipboard-drop-20261006]
    paths: ['TemHoa-MinhDien.html', 'assets/**', 'studio*', 'image-tools*', 'clipboard-tools.js', 'shape-tools.js', 'mo_temhoa.py', 'Mo-TemHoa-Windows.ps1', 'desktop/package.json', 'tests/**', '.github/workflows/design-editor.yml']
  pull_request:
    paths: ['TemHoa-MinhDien.html', 'assets/**', 'studio*', 'image-tools*', 'clipboard-tools.js', 'shape-tools.js', 'mo_temhoa.py', 'Mo-TemHoa-Windows.ps1', 'desktop/package.json', 'tests/**', '.github/workflows/design-editor.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pypdf PyMuPDF Pillow
      - run: node tests/studio-core.cjs
      - run: node tests/design-smoke.cjs
      - run: node tests/delete-template-smoke.cjs
      - run: node tests/output-paper-smoke.cjs
      - run: node tests/autosave-smoke.cjs
      - run: node tests/art-ui-smoke.cjs
        env:
          TEMHOA_SCREENSHOTS: screenshots
      - run: node tests/studio-smoke.cjs
        env:
          TEMHOA_SCREENSHOTS: screenshots
      - run: node tests/image-color-performance.cjs
      - run: node tests/image-tools-smoke.cjs
        env:
          TEMHOA_SCREENSHOTS: screenshots
      - run: node tests/editor-interactions-smoke.cjs
        env:
          TEMHOA_SCREENSHOTS: screenshots
      - run: node tests/clipboard-smoke.cjs
        env:
          TEMHOA_SCREENSHOTS: screenshots
      - run: node tests/properties-scroll-smoke.cjs
        env:
          TEMHOA_SCREENSHOTS: screenshots
      - run: node tests/recent-fonts-smoke.cjs
        env:
          TEMHOA_SCREENSHOTS: screenshots
      - run: node tests/shapes-smoke.cjs
        env:
          TEMHOA_SCREENSHOTS: screenshots
      - run: python tests/studio-pdf-check.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: temhoa-ui-screenshots
          path: screenshots
          if-no-files-found: ignore
