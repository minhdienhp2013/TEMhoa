name: Verify graphic editor
on:
  push:
    branches: [main]
    paths: ['TemHoa-MinhDien.html', 'tests/design-smoke.cjs', '.github/workflows/design-editor.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium --only-shell
      - run: node tests/design-smoke.cjs
